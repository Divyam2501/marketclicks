[project]
name = "tickstore"
version = "0.1.0"
description = "Real-time market data streaming and anomaly detection platform"
requires-python = ">=3.11"
authors = [{ name = "Divyam Kaushik" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "polygon-api-client>=1.16",
    "python-dotenv>=1.0",
    "websockets>=14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tickstore"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
